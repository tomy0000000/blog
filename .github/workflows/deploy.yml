name: 🚀 Build & Deploy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: 🛠 Build
    runs-on: ubuntu-latest
    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: "package.json"

      - name: 📦 Install Congo dependencies
        run: |
          cd themes/congo
          npm ci

      - name: ⚙️ Setup pnpm
        uses: pnpm/action-setup@v4

      - name: ⚙️ Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: ⚙️ Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ⬇️ Download static resources
        run: |
          scripts/download_static.sh

      - name: 🏗️ Build CSS
        run: npm run css-build

      - name: 🏗️ Build site
        uses: tomy0000000/actions/hugo-github-pages@main
        with:
          hugo_version: "0.155.0"
          upload: false

      # Temporary fix before gohugoio/hugo#5161 is resolved
      - name: 🔧 Fix 404 Page
        run: |
          scripts/patch_404.sh

      - name: ⬆️ Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    name: 🚀 Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
